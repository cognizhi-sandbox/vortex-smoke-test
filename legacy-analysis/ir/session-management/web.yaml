---
records:
  - record_key: session-management-auth-method-0001
    kind: requirement
    capability_key: session-management
    requirement: >
      The system SHALL use form-based authentication (FORM) for user login.
      This means users authenticate via an HTML login form (username/password submission)
      rather than alternative mechanisms (HTTP Basic, certificate-based, OAuth, SAML, etc.).
    confidence: high
    confidence_basis: >
      Both independent passes agreed on high confidence. The authentication method is
      explicitly declared in web.xml using the standard servlet container declarative
      configuration. The FORM auth-method is unambiguous and enforced by the container.
    risk_class: operational
    basis: >
      The web.xml deployment descriptor declares the authentication method using the
      <login-config> element with <auth-method>FORM</auth-method>. This is a declarative
      statement of system behaviour.
    traces:
      - path: legacy-source/web/WEB-INF/web.xml
        line_start: 4
        line_end: 4
        excerpt: |
          <login-config><auth-method>FORM</auth-method></login-config>
    crossvalidation:
      pass_a: session-management-auth-method-0001
      pass_b: session-management-form-auth-0001
      agreement: both_passes_agreed

  - record_key: session-management-timeout-0002
    kind: requirement
    capability_key: session-management
    requirement: >
      The system SHALL terminate user sessions after 30 minutes of inactivity.
      Sessions inactive for 30 minutes or more SHALL be invalidated.
      GIVEN a session that has been idle for 30 minutes, THEN the session SHALL be terminated.
    confidence: medium
    confidence_basis: >
      Both independent passes agreed on medium confidence. The session timeout is explicitly
      declared in web.xml using the standard servlet container declarative configuration. The
      value (30 minutes) is a bare literal with no documented business justification. Confidence
      is medium: clearly declared, but no explanation for the choice of 30 minutes.
    risk_class: operational
    basis: >
      The web.xml deployment descriptor declares the session timeout using the
      <session-config> element with <session-timeout>30</session-timeout>. The value
      is in minutes per servlet specification.
    traces:
      - path: legacy-source/web/WEB-INF/web.xml
        line_start: 5
        line_end: 5
        excerpt: |
          <session-config><session-timeout>30</session-timeout></session-config>
    crossvalidation:
      pass_a: session-management-timeout-0002
      pass_b: session-management-session-timeout-0002
      agreement: both_passes_agreed

findings:
  - kind: ambiguity
    path: legacy-source/web/WEB-INF/web.xml
    description: >
      The session timeout of 30 minutes has no documented business justification. Both
      passes independently flagged this. Is this value compliance-driven (regulatory,
      security standard), performance-driven (server resource constraints), or user
      experience-driven (balance between usability and security)? The 30-minute value
      should be documented with its rationale so it can be reviewed and potentially
      adjusted in future versions.
    crossvalidation: both_passes_agreed

  - kind: unparseable
    path: legacy-source/web/WEB-INF/web.xml
    description: >
      The web.xml configuration is minimal and does not declare any role-based access
      control (RBAC) or authorization rules. Both passes independently noted this. No
      <security-constraint> elements define which users or roles can access which paths.
      Authorization logic may exist in Java code or may be handled entirely by the billing
      and orders modules. This is not necessarily a gap — it indicates that authorization
      is not enforced at the web tier level.
    crossvalidation: both_passes_agreed
