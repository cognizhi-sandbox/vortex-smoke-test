---
records:
  - record_key: session-management-form-auth-0001
    kind: requirement
    capability_key: session-management
    requirement: >
      The system SHALL use form-based authentication for user login. Users authenticate
      by submitting username and password credentials via an HTML login form, rather than
      using alternative authentication methods (HTTP Basic authentication, certificate-based
      authentication, OAuth, SAML, etc.).
    confidence: high
    confidence_basis: >
      The authentication method is explicitly and unambiguously declared in the deployment
      descriptor using standard servlet configuration. The FORM auth-method is a container-enforced
      mechanism with no implementation ambiguity.
    risk_class: operational
    basis: >
      The web.xml deployment descriptor declares authentication configuration using the
      <login-config> element with <auth-method>FORM</auth-method>. This is declarative
      stated behaviour.
    traces:
      - path: legacy-source/web/WEB-INF/web.xml
        line_start: 4
        line_end: 4
        excerpt: |
          <login-config><auth-method>FORM</auth-method></login-config>

  - record_key: session-management-session-timeout-0002
    kind: requirement
    capability_key: session-management
    requirement: >
      The system SHALL invalidate user sessions after 30 minutes of inactivity. Sessions
      that remain idle for 30 minutes or longer SHALL be terminated by the container.
      GIVEN a user session inactive for 30 minutes, THEN the session SHALL be invalidated
      and the user SHALL be required to re-authenticate.
    confidence: medium
    confidence_basis: >
      The session timeout value (30 minutes) is explicitly declared in the deployment
      descriptor using standard servlet configuration. The value is a bare literal with
      no documented business or security rationale. Confidence is medium: clearly declared,
      but no explanation for the specific 30-minute duration.
    risk_class: operational
    basis: >
      The web.xml deployment descriptor declares session configuration using the
      <session-config> element with <session-timeout>30</session-timeout>. Per servlet
      specification, the timeout value is in minutes.
    traces:
      - path: legacy-source/web/WEB-INF/web.xml
        line_start: 5
        line_end: 5
        excerpt: |
          <session-config><session-timeout>30</session-timeout></session-config>

findings:
  - kind: ambiguity
    path: legacy-source/web/WEB-INF/web.xml
    description: >
      The session timeout of 30 minutes has no documented business or security justification.
      Is this value chosen for compliance reasons (regulatory requirement), security reasons
      (defense against session hijacking), performance reasons (server resource constraints),
      or user experience reasons (balance between usability and security)? The rationale
      should be documented when this requirement is ported to ensure the timeout remains
      appropriate for business needs.

  - kind: unparseable
    path: legacy-source/web/WEB-INF/web.xml
    description: >
      No authorization rules or role-based access control is declared in web.xml. There
      are no <security-constraint> elements defining which resources require authentication
      or which roles can access which paths. Authorization logic either exists in Java code
      (managed by the business logic modules) or is not enforced at the web tier. This is
      not necessarily a deficiency — it indicates that the web tier is not the authorization
      enforcement point.
