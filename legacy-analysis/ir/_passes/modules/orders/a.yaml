---
records:
  - record_key: order-approval-threshold-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL require manager approval for orders with a total amount of $5,000
      or greater. Orders below $5,000 do not require approval.
      GIVEN an order total >= $5,000, THEN approval is required.
      GIVEN an order total < $5,000, THEN approval is not required.
    confidence: medium
    confidence_basis: >
      The $5,000 threshold is documented in a code comment ("Orders at or above this
      total require a manager's approval") and enforced in the requiresApproval() method.
      The value is a bare literal with no configuration mechanism, but the intent is clear.
    risk_class: financial
    basis: >
      The OrderRules class defines APPROVAL_THRESHOLD as 5000.00 with an explanatory
      comment. The requiresApproval() method implements the comparison using >=, making
      $5,000 orders requiring approval.
    traces:
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 5
        line_end: 6
        excerpt: |
          /** Orders at or above this total require a manager's approval. */
          private static final double APPROVAL_THRESHOLD = 5000.00d;
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 15
        line_end: 15
        excerpt: |
          return orderTotal >= APPROVAL_THRESHOLD;

  - record_key: order-approval-platinum-bypass-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Platinum tier customers are granted a bypass that doubles the standard approval
      threshold. Platinum customers require approval only for orders totaling $10,000
      or more (twice the standard $5,000 threshold). Orders below $10,000 do not require
      approval for Platinum customers.
      GIVEN a Platinum customer with order total >= $10,000, THEN approval is required.
      GIVEN a Platinum customer with order total < $10,000, THEN approval is not required.
    confidence: low
    confidence_basis: >
      The 2x multiplier is enforced in code with a comment ("Platinum customers bypass
      approval up to twice the threshold") but the multiplier value (2) is a bare literal
      with no documented business justification. Confidence is low due to undocumented
      scaling factor.
    risk_class: financial
    basis: >
      The requiresApproval() method contains a conditional check for Platinum tier
      customers that multiplies the threshold by 2. The comment explains the intent but
      not why the multiplier is 2 or when this policy was established.
    traces:
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 11
        line_end: 13
        excerpt: |
          if ("PLATINUM".equals(customerTier)) {
              // Platinum customers bypass approval up to twice the threshold.
              return orderTotal >= (APPROVAL_THRESHOLD * 2);

  - record_key: order-fulfillment-free-shipping-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide free shipping for orders with a total amount of $75
      or more. Orders below $75 are subject to shipping charges.
      GIVEN an order total >= $75, THEN shipping cost is $0.
      GIVEN an order total < $75, THEN shipping cost is calculated per the handling charge formula.
    confidence: medium
    confidence_basis: >
      The $75 threshold is documented in a code comment ("Orders below this total ship free")
      and enforced in the shippingCost() method. The value is a bare literal, but the intent
      is clearly stated.
    risk_class: financial
    basis: >
      The OrderRules class defines FREE_SHIPPING_MIN as 75.00 with an explanatory comment.
      The shippingCost() method checks if orderTotal >= FREE_SHIPPING_MIN and returns 0.0d
      if true.
    traces:
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 7
        line_end: 8
        excerpt: |
          /** Orders below this total ship free. */
          private static final double FREE_SHIPPING_MIN = 75.00d;
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 19
        line_end: 19
        excerpt: |
          if (orderTotal >= FREE_SHIPPING_MIN) return 0.0d;

  - record_key: order-fulfillment-shipping-calculation-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      For orders below $75 (subject to shipping charges), the shipping cost SHALL be
      calculated as a flat rate of $4.95 plus a per-item handling charge of $0.75
      per item in the order.
      Formula: shipping = 4.95 + (itemCount * 0.75)
      GIVEN an order < $75 with N items, THEN shipping cost = $4.95 + ($0.75 × N).
    confidence: low
    confidence_basis: >
      The shipping calculation is implemented as bare literals ($4.95 flat rate, $0.75
      per item) with only an inline comment ("Flat rate plus a per-item handling charge").
      No explanation for these values or when they were established. No configuration
      mechanism exists. Confidence is low due to undocumented values.
    risk_class: financial
    basis: >
      The shippingCost() method implements the formula using hardcoded values: 4.95d
      (flat rate) and 0.75d (per-item rate). The inline comment describes the general
      formula but not the specific values.
    traces:
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 20
        line_end: 21
        excerpt: |
          // Flat rate plus a per-item handling charge.
          return 4.95d + (itemCount * 0.75d);

  - record_key: order-fulfillment-cancellation-0005
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      Orders may be cancelled only before entering fulfilment. Specifically, orders
      with status PENDING or APPROVED may be cancelled. Orders in any other status
      (e.g., SHIPPED, FULFILLED, FAILED) cannot be cancelled.
      GIVEN an order with status PENDING, THEN cancellation is permitted.
      GIVEN an order with status APPROVED, THEN cancellation is permitted.
      GIVEN an order with any other status, THEN cancellation is not permitted.
    confidence: medium
    confidence_basis: >
      The two cancellable statuses (PENDING and APPROVED) are clearly implemented in
      the canCancel() method. The comment explains the business intent. However, the
      enumeration of other possible statuses is implicit and not documented.
    risk_class: operational
    basis: >
      The canCancel() method performs an equality check on the status parameter,
      returning true only for PENDING or APPROVED. The comment ("An order may only be
      cancelled before it enters fulfilment") describes the intent but does not enumerate
      other valid statuses.
    traces:
      - path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
        line_start: 24
        line_end: 26
        excerpt: |
          public boolean canCancel(String status) {
              // An order may only be cancelled before it enters fulfilment.
              return "PENDING".equals(status) || "APPROVED".equals(status);

