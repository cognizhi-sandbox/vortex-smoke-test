    description: >
      The Platinum tier approval multiplier (2x) has no documented business justification.
      Why 2? When was Platinum tier established? Is 2x a contractual commitment, a risk
      calculation, or a historical artifact? Does Platinum entitle any other benefits?
      This should be documented for compliance and audit purposes.

  - kind: ambiguity
    path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
    description: >
      The shipping cost components ($4.95 flat rate and $0.75 per item) are hardcoded
      with no justification. What cost basis do these reflect (packaging, handling, carrier
      subsidy, margin)? When were they last reviewed? How often should they be adjusted?
      No configuration mechanism exists for updating these values.

  - kind: ambiguity
    path: legacy-source/modules/orders/src/com/petstore/orders/OrderRules.java
    description: >
      Order status enumeration is implicit. The code shows PENDING and APPROVED as
      cancellable, but does not formally define the complete status state machine or
      the valid transitions between statuses. What statuses exist (SHIPPED, FULFILLED,
      FAILED, CANCELLED, RETURNED)? When does each transition occur? This should be
      documented as a formal state machine.
