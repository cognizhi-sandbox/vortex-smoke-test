  - record_key: BILL-CARD-EXPIRY-001
    kind: business-rule
    capability_key: card-expiration-validation
    requirement: >
      The system SHALL validate card expiration by comparing the card's expiry
      year and month against the current year and month. GIVEN a card with
      expiryYear and expiryMonth, WHEN expiryYear is less than the current year,
      THEN the card is expired. WHEN expiryYear equals the current year AND
      expiryMonth is less than the current month, THEN the card is expired.
      Otherwise, the card is not expired.
    confidence: high
    confidence_basis: >
      The expiry logic is explicitly implemented in the isExpired method with
      clear conditional branches. The logic is straightforward comparison without
      configuration or alternative implementations visible.
    risk_class: financial
    basis: >
      The isExpired method implements card expiration validation logic:
      `if (expiryYear < nowYear) return true;` (expired if year is in past), then
      `return expiryYear == nowYear && expiryMonth < nowMonth;` (expired if same
      year but past month). This is standard credit card expiry validation logic.
    traces:
      - path: legacy-source/modules/billing/src/com/petstore/billing/CreditCardValidator.java
        line_start: 12
        line_end: 15
        excerpt: |
          public boolean isExpired(int expiryYear, int expiryMonth, int nowYear, int nowMonth) {
              if (expiryYear < nowYear) return true;
              return expiryYear == nowYear && expiryMonth < nowMonth;
          }
    stack_metadata:
      framework: none

  - record_key: BILL-REFUND-WINDOW-001
    kind: business-rule
    capability_key: refund-eligibility-period
    requirement: >
      The system SHALL permit refunds for transactions within 90 days after
      settlement. GIVEN a transaction was settled N days ago, WHEN N is less than
      or equal to 90, THEN a refund SHALL be eligible. WHEN N exceeds 90 days,
      THEN a refund is NOT eligible.
    confidence: high
    confidence_basis: >
      The 90-day refund window is explicitly encoded in the canRefund method as a
      numeric literal. The logic is straightforward: `daysSinceSettlement <= 90`.
      The method documentation reiterates the 90-day constraint. There is no
      configuration override or alternative window visible.
    risk_class: financial
    basis: >
      The canRefund method enforces the refund eligibility window:
      `return daysSinceSettlement <= 90;`. The method comment states "Refunds are
      permitted for 90 days after settlement." This is a critical financial rule
      that constrains the refund request deadline.
    traces:
      - path: legacy-source/modules/billing/src/com/petstore/billing/CreditCardValidator.java
        line_start: 17
        line_end: 20
        excerpt: |
          /** Refunds are permitted for 90 days after settlement. */
          public boolean canRefund(int daysSinceSettlement) {
              return daysSinceSettlement <= 90;
          }
    stack_metadata:
      framework: none

  - record_key: BILL-CARD-BRAND-HISTORY-001
    kind: business-rule
    capability_key: american-express-deprecation
    requirement: >
      American Express cards are not accepted. This decision was made in 2003 and
      remains in effect as of the current implementation.
    confidence: medium
    confidence_basis: >
      The inline comment in the code states "Amex was dropped in 2003." This
      indicates a historical decision, not a contemporary rule. The actual
      implementation (exclusion via first-digit check) is code-level enforcement,
      but the date and reasoning are provided only as a comment, not as
      configuration or documented policy.
    risk_class: financial
    basis: >
      The comment in isAcceptedBrand method provides historical context: "Visa (4)
      and Mastercard (5) only; Amex was dropped in 2003." This indicates American
      Express was previously accepted but is now excluded. The comment provides
      reasoning (deliberate removal in 2003) rather than a current business
      rationale, suggesting this may be legacy policy.
