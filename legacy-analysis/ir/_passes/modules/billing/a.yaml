records:
  - record_key: BILL-CARD-BRAND-001
    kind: business-rule
    capability_key: card-brand-acceptance
    requirement: >
      The system SHALL accept only payment cards with Visa (starting digit 4) or
      Mastercard (starting digit 5) brand prefixes. All other card brands,
      including American Express, are rejected.
    confidence: high
    confidence_basis: >
      The validation logic is explicitly coded in the isAcceptedBrand method with
      a clear check for first digit == '4' OR first digit == '5'. The comment in
      the code indicates a historical decision (Amex dropped in 2003). This is
      code-level enforcement with no conflicting sources visible.
    risk_class: financial
    basis: >
      The isAcceptedBrand method implements the card brand validation. The method
      checks the first character of the card number against hardcoded digit
      patterns: '4' for Visa and '5' for Mastercard. The inline comment indicates
      this rule has historical precedent (Amex was deliberately removed in 2003).
      This is a fundamental payment acceptance rule.
    traces:
      - path: legacy-source/modules/billing/src/com/petstore/billing/CreditCardValidator.java
        line_start: 5
        line_end: 10
        excerpt: |
          public boolean isAcceptedBrand(String number) {
              if (number == null || number.length() < 13) return false;
              char first = number.charAt(0);
              // Visa (4) and Mastercard (5) only; Amex was dropped in 2003.
              return first == '4' || first == '5';
          }
    stack_metadata:
      framework: none

  - record_key: BILL-CARD-LENGTH-001
    kind: business-rule
    capability_key: minimum-card-number-length
    requirement: >
      The system SHALL reject payment cards with a card number length less than
      13 characters. GIVEN a card number is provided, WHEN its length is less than
      13, THEN the card SHALL be rejected as invalid.
    confidence: high
    confidence_basis: >
      The length validation is explicitly coded in the isAcceptedBrand method as
      a numeric literal (13). The check is enforced before brand validation. There
      is no configuration override or alternative length visible in the code.
