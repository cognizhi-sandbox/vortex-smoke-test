findings_by_status:
  agreed:
    - Hardcoded payment gateway endpoint with no environment-specific overrides
    - Payment timeout scope ambiguous (network vs. entire flow vs. connection only)
    - No retry policy or fallback behavior specified for gateway failures
    - Configuration files untyped (properties format), unclear parsing behavior

  partial:
    - Hardcoded endpoint risk framing (Pass A emphasizes deployment environment risk;
      Pass B doesn't explicitly frame this security risk)

  unidentified_by_either_pass:
    - Connection pool incomplete configuration (Pass B identified: no min size, timeouts,
      creation strategy; Pass A did not)
      This is a valid finding that Pass A missed but Pass B caught.

analysis_notes:
  - Pass A and Pass B identified the same 5 core requirements (database connectivity,
    authentication, pool size, gateway endpoint, gateway auth) with 100% semantic
    agreement. Differences in record naming and granularity are immaterial.
  - Pass A confidence for database-auth was medium (code-only assumption);
    Pass B assigned high (configuration + visibility + property name + standard practice).
    Cross-validation supports upgrade to high (both passes agree on same source).
  - Pass A confidence for gateway-auth was medium (code-only assumption);
    Pass B assigned high (redaction + property name confirm secret).
    Cross-validation supports upgrade to high.
  - Key difference: Pass B identified an additional finding (connection pool incomplete
    config) that Pass A did not explicitly flag. This is a valid finding worth carrying
    forward.
  - All ambiguity findings (4 agreed + 1 partial) are substantive and should be carried
    forward for future refinement.
